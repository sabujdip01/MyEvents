<?xml version="1.0" encoding="UTF-8"?>
<!--
  il_hero_calendar.svg — Source SVG for the desk-calendar hero illustration.
  Design spec: design.md §5.8.  ViewBox: 180×180.

  Colours below use Palette A Light as reference. The Kotlin composable
  (HeroIllustration.kt) builds an ImageVector from these paths and substitutes
  theme tokens at runtime, so this file is documentation / design-tool source only.

  Layers (back to front):
    1. Background blobs        (doodle @8%/6%)
    2. Leaf sprigs              (accent @70%)
    3. Ground shadow            (doodle @12%)
    4. Calendar body            (surface)
    5. Right depth edge         (primary @35%)
    6. Purple header strip      (primary)
    7. Strip sheen              (white @10%)
    8. Three binder rings       (primary stroke)
    9. Ring highlights          (white @35% stroke)
   10. Main heart               (primary)
   11. Heart gloss              (white @28%)
   12. Floating hearts          (primary @60%/@35%)
-->
